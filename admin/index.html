<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Administration - Portfolio Rivo</title>
    <link rel="stylesheet" href="admin.css"> <!-- liaison avec le css-->
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg"> <!-- Ajout du favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
    <link rel="icon" href="../assets/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">    
</head>

<body>
    <main class="admin-container">
        <section id="connexion-admin"
                 class="admin-card"> <!-- actuellement visible -->
            <h1>Administration du portfolio</h1>
            <p class="admin-description">
                Connectez-vous pour gérer les publications.
            </p>
            <form id="form-connexion"> <!-- form, label et input définissent le formulaire-->
                <label for="email">
                    E-mail
                </label>
                <input
                    type="email"
                    id="email"
                    required      
                >  <!-- required signifie que le champ (indentifiant) à saisir est obligatoire-->
                <label for="password">
                    Mot de passe
                </label>
                <input
                    type="password"
                    id="password"
                    required
                > <!--saisie masquée obligatoire du mot de passe -->
                <button type="submit">
                    Se connecter
                </button> <!--une fois connecté, déclenche le javascript-->
            </form>
            <p id="message-connexion"></p>
        </section>
        <section id="dashboard-admin"
                 class="admin-card cache"> <!-- admin-card cache signifie que le dashboard est initialement caché par le css-->
            <h2>Gestion des publications</h2>
            <p>
                Authentification réussie.
            </p>
            <p id="message-dashboard"></p>
           
            <button type="button" id="btn-ouvrir-ajout">
                Ajouter une publication
            </button>

            <form id="form-ajout" class="cache"> <!-- Ajout du formulaire pour ajouter une nouvelle publication, initialement invisible -->
                <h3>Ajouter une publication</h3>

                <label for="ajout-id">Identifiant technique</label>
                <input
                type="text"
                id="ajout-id"
                required
                >

                <label for="ajout-authors">Auteurs</label>
                <textarea
                id="ajout-authors"
                rows="4"
                required
                ></textarea>

                <label for="ajout-title">Titre</label>
                <input
                type="text"
                id="ajout-title"
                required
                >

                <label for="ajout-journal">Journal</label>
                <input
                type="text"
                id="ajout-journal"
                >

                <label for="ajout-volume">Volume</label>
                <input
                type="text"
                id="ajout-volume"
                >

                <label for="ajout-number">Numéro</label>
                <input
                type="text"
                id="ajout-number"
                >

                <label for="ajout-pages">Pages</label>
                <input
                type="text"
                id="ajout-pages"
                >

                <label for="ajout-year">Année</label>
                <input
                type="number"
                id="ajout-year"
                required
                >

                <label for="ajout-doi">DOI</label>
                <input
                type="text"
                id="ajout-doi"
                required
                >

                <button type="submit">
                    Ajouter
                </button>

                <button type="button" id="btn-annuler-ajout">
                    Annuler
                </button>

            </form>            

            <form id="form-modification" class="cache"> <!-- Ajout du formulaire pour modifier une publication existante qui est à la base caché -->
                <h3>Modifier la publication</h3>

                <label for="modif-authors">Auteurs</label> <!-- champ auteurs à modifier -->
                <textarea 
                id="modif-authors"
                rows="4"
                required
                ></textarea>

                <label for="modif-title">Titre</label> <!-- champ titre à modifier -->
                <input
                type="text"
                id="modif-title"
                required
                >

                <label for="modif-journal">Journal</label> <!-- champ journal à modifier -->
                <input
                type="text"
                id="modif-journal"
                >

                <label for="modif-volume">Volume</label> <!-- champ volume à modifier -->
                <input
                type="text"
                id="modif-volume"
                >

                <label for="modif-number">Numéro</label> <!-- champ nombre à modifier -->
                <input
                type="text"
                id="modif-number"
                >

                <label for="modif-pages">Pages</label> <!-- champ pages à modifier -->
                <input
                type="text"
                id="modif-pages"
                >

                <label for="modif-year">Année</label> <!-- champ année à modifier -->
                <input
                type="number"
                id="modif-year"
                required
                >

                <label for="modif-doi">DOI</label> <!-- champ doi à modifier -->
                <input
                type="text"
                id="modif-doi"
                required
                >

                <button type="submit"> <!-- Bouton Enregistrer les modifications -->
                    Enregistrer les modifications
                </button>

                <button type="button" id="btn-annuler-modification"> <!-- Bouton Annuler les modifications -->
                    Annuler
                </button>
            </form>

            <div id="liste-admin-publications"> <!-- une fois connecté, les 3 publications actuelles sont affichées dans l'administration -->

            </div>
            <button id="btn-deconnexion">
                Se déconnecter
            </button>
        </section> <!-- future interface CRUD-->
    </main>
    <script src="admin.js"></script> <!--liaison avec le javascript-->
</body>
</html>
